[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ripperdoc-agent-sdk"
dynamic = ["version"]
description = "Python SDK for Ripperdoc AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ripperdoc Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anyio>=4.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "trio>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/quantmew/ripperdoc-agent-sdk-python"
Documentation = "https://github.com/quantmew/ripperdoc-agent-sdk-python#readme"
Repository = "https://github.com/quantmew/ripperdoc-agent-sdk-python"
"Bug Tracker" = "https://github.com/quantmew/ripperdoc-agent-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ripperdoc_agent_sdk*"]

[tool.setuptools.dynamic]
version = {attr = "ripperdoc_agent_sdk._version.__version__"}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to false initially for compatibility
files = ["ripperdoc_agent_sdk"]
exclude = ["^tests/", "^setup\\.py$"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
